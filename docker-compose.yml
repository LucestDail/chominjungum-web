services:
  db:
    image: postgres:16-alpine
    container_name: chominjungum-db
    environment:
      POSTGRES_DB: chominjungum
      POSTGRES_USER: chominjungum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chominjungum}
    ports:
      - '55432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chominjungum -d chominjungum']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
